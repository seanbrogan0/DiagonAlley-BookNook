; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps = fastled/FastLED@^3.10.3
build_src_filter = +<*> -<demo_main.cpp>
; This board's bootloader is the newer Optiboot (115200 baud), not the
; old-bootloader default (57600) PlatformIO assumes for nanoatmega328.
upload_speed = 115200

; Standalone preview build: plays all spell effects back-to-back.
; See src/demo_main.cpp. Flash with `pio run -e demo_effects -t upload`,
; then restore normal firmware with `pio run -e nanoatmega328 -t upload`.
[env:demo_effects]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps = fastled/FastLED@^3.10.3
build_src_filter = +<*> -<main.cpp>
upload_speed = 115200
